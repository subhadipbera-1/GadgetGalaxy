    <div class="container">
        <h1>Cart</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="cart-body">
                <!-- cart items will be displayed here -->
            </tbody>
        </table>
    </div>

    <!-- product modal -->
    <div class="modal fade" id="product-modal" tabindex="-1" role="dialog" aria-labelledby="product-modal-label" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="product-modal-label">Product Details</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <img src="assets/img/earbud6.jpeg" alt="" class="product-image">
                    <h2 class="product-name"></h2>
                    <p class="product-description"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

<script type="text/javascript">
    const cart = [
    {
        id: 1,
        name: 'Product 1',
        price: 19.99,
        quantity: 1,
        imageUrl: 'assets/img/Samsung-S24.jpeg',
        description: 'This is product 1'
    },
    {
        id: 2,
        name: 'Product 2',
        price: 9.99,
        quantity: 2,
        imageUrl: 'images/product2.jpg',
        description: 'This is product 2'
    },
    // ...
];

const cartBody = document.getElementById('cart-body');

cart.forEach((item) => {
    const row = document.createElement('tr');
    row.innerHTML = `
        <td>
            <img src="${item.imageUrl}" alt="" class="product-image">
            <a href="#" data-toggle="modal" data-target="#product-modal">
                <span class="product-name">${item.name}</span>
            </a>
        </td>
        <td>
            <input type="number" class="form-control quantity" value="${item.quantity}" min="1">
            <button class="btn btn-sm btn-primary increase-quantity">+</button>
            <button class="btn btn-sm btn-primary decrease-quantity">-</button>
        </td>
        <td>
                    <td>$${item.price}</td>
        <td>$${item.price * item.quantity}</td>
        <td>
            <button class="btn btn-sm btn-danger remove-item">Remove</button>
        </td>
    `;
    cartBody.appendChild(row);
});

// Add event listeners to quantity buttons
cartBody.addEventListener('click', (e) => {
    if (e.target.classList.contains('increase-quantity')) {
        const quantityInput = e.target.previousElementSibling;
        quantityInput.value = parseInt(quantityInput.value) + 1;
        updateTotal(e.target.closest('tr'));
    } else if (e.target.classList.contains('decrease-quantity')) {
        const quantityInput = e.target.nextElementSibling;
        if (quantityInput.value > 1) {
            quantityInput.value = parseInt(quantityInput.value) - 1;
            updateTotal(e.target.closest('tr'));
        }
    } else if (e.target.classList.contains('remove-item')) {
        e.target.closest('tr').remove();
    }
});

// Update total price when quantity changes
function updateTotal(row) {
    const price = parseFloat(row.cells[2].textContent);
    const quantity = parseInt(row.cells[1].querySelector('input').value);
    const total = price * quantity;
    row.cells[3].textContent = `$${total.toFixed(2)}`;
}

// Show product details in modal
cartBody.addEventListener('click', (e) => {
    if (e.target.tagName === 'A') {
        const product = cart.find((item) => item.name === e.target.textContent);
        const modal = document.getElementById('product-modal');
        modal.querySelector('.product-image-modal').src = product.imageUrl;
        modal.querySelector('.product-name').textContent = product.name;
        modal.querySelector('.product-description').textContent = product.description;
    }
});
</script>
